name: Bug report
description: Report a reproducible tester bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: dropdown
    id: package_type
    attributes:
      label: Package type
      options:
        - SCORM zip
        - generic zip
        - unpacked folder
    validations:
      required: true
  - type: input
    id: launch_mode
    attributes:
      label: Launch mode
      placeholder: mock
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or sanitized sample
      description: Attach diagnostics or a sanitized sample package only if it is safe to share publicly.
